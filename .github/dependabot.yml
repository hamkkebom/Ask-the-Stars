version: 2
updates:
  # npm 의존성 자동 업데이트
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "hamkkebom"
    assignees:
      - "hamkkebom"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
      include: "scope"
    # 주요 버전 업데이트는 수동으로 처리
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # 주요 버전 업데이트 무시 (수동 검토 필요)
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nestjs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions 자동 업데이트
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    open-pull-requests-limit: 5
    reviewers:
      - "hamkkebom"
    labels:
      - "ci/cd"
      - "github-actions"
    commit-message:
      prefix: "ci:"
      include: "scope"

  # Docker 이미지 업데이트
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
    open-pull-requests-limit: 5
    reviewers:
      - "hamkkebom"
    labels:
      - "docker"
      - "infrastructure"
    commit-message:
      prefix: "ci(docker):"
      include: "scope"
